# 人民数据城市词元工厂 - 生产环境 Docker Compose 配置
#
# 部署步骤:
#   1. 复制 .env.prod.example 为 .env.prod
#   2. 修改 .env.prod 中的密码和配置
#   3. docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   4. 访问 http://your-server-ip:3000

version: '3.4'

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-peopledata:latest
    container_name: new-api-peopledata
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 数据库配置 - PostgreSQL
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Redis 配置
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379

      # 会话密钥
      - SESSION_SECRET=${SESSION_SECRET}

      # 管理员初始密码
      - INITIAL_ROOT_PASSWORD=${INITIAL_ROOT_PASSWORD}

      # 可选：ClickHouse 日志存储
      # - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}?dial_timeout=10s&max_execution_time=60

      # 时区设置
      - TZ=${TZ:-Asia/Shanghai}

    depends_on:
      - postgres
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: postgres-peopledata
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 如需外部访问，取消注释下方端口映射
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: redis-peopledata
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 如需外部访问，取消注释下方端口映射
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"

  # 可选：ClickHouse 日志存储（用于大规模日志查询）
  # 如果不需要，可以删除此服务
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.8
  #   container_name: clickhouse-peopledata
  #   restart: always
  #   environment:
  #     CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  #     CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  #     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  #     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  #     TZ: ${TZ:-Asia/Shanghai}
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #   networks:
  #     - new-api-network
  #   healthcheck:
  #     test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   # 如需外部访问，取消注释下方端口映射
  #   # ports:
  #   #   - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"  # HTTP interface
  #   #   - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"  # Native interface

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  # clickhouse_data:
  #   driver: local

networks:
  new-api-network:
    driver: bridge
